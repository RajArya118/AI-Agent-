version: '3.8'

services:
  buildpilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buildpilot-app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - MONGODB_URL=mongodb://mongo:27017/buildpilot
      - GEMINI_MODEL=gemini-3.8-flash
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongo
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/generated_projects:/app/backend/generated_projects

  mongo:
    image: mongo:7.0
    container_name: buildpilot-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
